stages:
  - validate
  - deploy

# The private GitLab.com mirror supplies runners; capstone is the source of truth.
workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH'
    - when: never

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.frontend_job:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - Keepers/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd Keepers
    - npm ci --cache ../.npm --prefer-offline --no-audit

frontend_typecheck:
  extends: .frontend_job
  stage: validate
  script:
    - npm run typecheck

frontend_lint:
  extends: .frontend_job
  stage: validate
  script:
    - npm run lint

frontend_tests:
  extends: .frontend_job
  stage: validate
  script:
    - npm test

backend_tests:
  image: python:3.14-slim
  stage: validate
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key:
      files:
        - server/requirements-test.txt
    paths:
      - .pip-cache/
  script:
    - python -m pip install -r server/requirements-test.txt
    - python -m unittest discover -s server/tests -t server -v

backend_syntax:
  image: python:3.14-slim
  stage: validate
  script:
    - python -m compileall -q server Image_Process_PL ML_Pipeline Scrapers

deploy_web:
  extends: .frontend_job
  stage: deploy
  interruptible: false
  resource_group: cloudflare-production
  environment:
    name: production
    url: https://keepers-9qp.pages.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - |
      : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in GitLab CI/CD variables}"
      : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in GitLab CI/CD variables}"
      : "${CLOUDFLARE_PAGES_PROJECT_NAME:?Set CLOUDFLARE_PAGES_PROJECT_NAME in GitLab CI/CD variables}"
      export EXPO_NO_DOTENV=1
      export EXPO_PUBLIC_SERVER_URL=https://keepers-fu6r.onrender.com
      unset EXPO_PUBLIC_KEEPERS_GOOGLE_AI_API_KEY EXPO_PUBLIC_KEEPERS_OPENAI_API_KEY
      npm run build:web
    # Direct Upload projects can use a production branch name other than main.
    - |
      CLOUDFLARE_PAGES_BRANCH="$(node --input-type=module -e '
        const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_PAGES_PROJECT_NAME: project } = process.env;
        const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project)}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await response.json();
        if (!response.ok || !data.success || !data.result?.production_branch) {
          throw new Error("Could not read the Pages production branch. Check the account ID, project name, and token permissions.");
        }
        console.log(data.result.production_branch);
      ')"
      npx --yes wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch "$CLOUDFLARE_PAGES_BRANCH" --commit-hash "$CI_COMMIT_SHA"
