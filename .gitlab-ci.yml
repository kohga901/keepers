stages:
  - validate

# The private GitLab.com mirror supplies runners; capstone is the source of truth.
workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH'
    - when: never

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.frontend_job:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - Keepers/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd Keepers
    - npm ci --cache ../.npm --prefer-offline --no-audit

frontend_typecheck:
  extends: .frontend_job
  stage: validate
  script:
    - npm run typecheck

frontend_lint:
  extends: .frontend_job
  stage: validate
  script:
    - npm run lint

frontend_tests:
  extends: .frontend_job
  stage: validate
  script:
    - npm test

backend_tests:
  image: python:3.14-slim
  stage: validate
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key:
      files:
        - server/requirements-test.txt
    paths:
      - .pip-cache/
  script:
    - python -m pip install -r server/requirements-test.txt
    - python -m unittest discover -s server/tests -t server -v

backend_syntax:
  image: python:3.14-slim
  stage: validate
  script:
    - python -m compileall -q server Image_Process_PL ML_Pipeline Scrapers
