stages:
  - validate
  - build

# Run for merge requests and branch pushes, while avoiding a duplicate branch
# pipeline when the branch already has an open merge request.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.frontend_job:
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - Keepers/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd Keepers
    - npm ci --cache ../.npm --prefer-offline --no-audit

frontend_typecheck:
  extends: .frontend_job
  stage: validate
  script:
    - npm run typecheck

frontend_lint:
  extends: .frontend_job
  stage: validate
  script:
    - npm run lint
  # The repository currently has known React hook lint errors. Keep the
  # report visible without blocking merges until those are fixed.
  allow_failure: true

backend_syntax:
  image: python:3.14-slim
  stage: validate
  script:
    - python -m compileall -q server Image_Process_PL ML_Pipeline Scrapers

frontend_web_build:
  extends: .frontend_job
  stage: build
  needs:
    - frontend_typecheck
    - backend_syntax
  script:
    - npm run build:web
  artifacts:
    name: "keepers-web-${CI_COMMIT_SHORT_SHA}"
    paths:
      - Keepers/dist/
    expire_in: 1 week
